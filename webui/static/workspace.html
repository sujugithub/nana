<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nana · Workspace</title>
    <style>
      :root {
        --bg: #e8eafa;
        --ink: #222b40;
        --muted: #66718c;
        --panel: #ffffffbb;
        --line: #ffffffd9;
        --accent: #5256a4;
        --soft: #dce0f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        font:
          15px/1.5 system-ui,
          -apple-system,
          sans-serif;
        background:
          radial-gradient(ellipse at 90% 20%, #c2daf5, transparent 70%),
          radial-gradient(ellipse at 20% 80%, #d7cdf3, transparent 60%),
          var(--bg);
        min-height: 100vh;
      }
      body.dark {
        --bg: #171d32;
        --ink: #edf0ff;
        --muted: #aeb8d5;
        --panel: #222b43dd;
        --line: #414a68;
        --accent: #aaa9fc;
        --soft: #343d60;
        background: var(--bg);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      .button {
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 10px 16px;
        border-radius: 13px;
        color: inherit;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      button:hover,
      .button:hover {
        background: var(--soft);
      }
      button.primary {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      input,
      textarea,
      select {
        border: 1px solid #aeb8d955;
        background: var(--panel);
        border-radius: 12px;
        padding: 10px 12px;
        max-width: 100%;
        width: 100%;
      }
      textarea {
        resize: vertical;
        min-height: 130px;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin: 12px 0 5px;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font:
          42px/1.1 Georgia,
          serif;
        letter-spacing: -1px;
      }
      h2 {
        font-size: 20px;
      }
      h3 {
        font-size: 16px;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
      aside {
        position: fixed;
        inset: 0 auto 0 0;
        width: 235px;
        background: #ffffff40;
        border-right: 1px solid var(--line);
        backdrop-filter: blur(18px);
        padding: 28px 18px;
        display: flex;
        flex-direction: column;
        overflow: auto;
      }
      .brand {
        font: 42px Georgia;
        color: var(--ink);
        text-decoration: none;
        margin: 0 12px 22px;
      }
      nav {
        display: grid;
        gap: 3px;
      }
      nav button {
        background: none;
        border-color: transparent;
        text-align: left;
        padding: 8px 13px;
        border-radius: 10px;
      }
      nav button.active {
        background: var(--soft);
      }
      .nav-label {
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
        padding: 14px 13px 4px;
      }
      .aside-bottom {
        margin-top: auto;
        padding-top: 25px;
      }
      .aside-bottom p {
        font-size: 12px;
        margin: 12px 12px 0;
      }
      main {
        margin-left: 235px;
        padding: 40px 48px 80px;
        max-width: 1700px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 30px;
      }
      header p {
        margin: 10px 0 0;
      }
      .mode {
        font-size: 12px;
        padding: 7px 13px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 30px;
        white-space: nowrap;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
        gap: 16px;
      }
      .card,
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 23px;
        box-shadow: 0 9px 25px #536ba00b;
      }
      .card {
        overflow: hidden;
      }
      .card p {
        margin: 8px 0;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .card small {
        color: var(--muted);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .row > * {
        flex: 0 0 auto;
      }
      .row input,
      .row select {
        width: auto;
      }
      .toolbar {
        margin-bottom: 20px;
      }
      .split {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 20px;
      }
      .list {
        display: grid;
        gap: 8px;
        align-content: start;
      }
      .item {
        text-align: left;
        display: block;
        width: 100%;
        padding: 15px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item small {
        display: block;
        color: var(--muted);
      }
      .editor textarea {
        min-height: 380px;
      }
      .editor > input {
        font-size: 22px;
      }
      .tag {
        font-size: 11px;
        background: var(--soft);
        padding: 3px 8px;
        border-radius: 20px;
      }
      .empty {
        padding: 50px 25px;
        text-align: center;
        border: 1px dashed #97a4cc80;
        border-radius: 22px;
      }
      .columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .notice {
        padding: 13px 18px;
        background: var(--soft);
        border-radius: 12px;
        margin-bottom: 20px;
      }
      .error {
        color: #ad3b4b;
      }
      .checklist {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 15px 0;
      }
      .checklist label {
        margin: 0;
        padding: 7px 12px;
        background: var(--panel);
        border-radius: 12px;
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .checklist input {
        width: auto;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        font:
          13px/1.6 ui-monospace,
          SFMono-Regular,
          monospace;
        background: var(--soft);
        padding: 15px;
        border-radius: 12px;
        max-height: 400px;
        overflow: auto;
      }
      .answer {
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--ink);
        line-height: 1.8;
      }
      .gallery img {
        width: 100%;
        height: 180px;
        object-fit: contain;
        background: var(--soft);
        border-radius: 10px;
      }
      .gallery canvas {
        max-width: 100%;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 28px;
        background: var(--bg);
        color: var(--ink);
        max-width: 760px;
        width: 90vw;
        max-height: 90vh;
        overflow: auto;
      }
      dialog::backdrop {
        background: #17234055;
        backdrop-filter: blur(6px);
      }
      #toast {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 12px 20px;
        border-radius: 15px;
        z-index: 10;
        box-shadow: 0 8px 30px #0002;
      }
      #toast:empty {
        display: none;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      .wide {
        grid-column: 1/-1;
      }
      .steps summary {
        cursor: pointer;
        font-size: 13px;
        color: var(--muted);
      }
      .muted {
        color: var(--muted);
      }
      @media (max-width: 1000px) {
        main {
          padding: 30px 25px;
        }
        .split {
          grid-template-columns: 240px 1fr;
        }
        .columns {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 700px) {
        aside {
          position: static;
          width: auto;
          padding: 12px;
        }
        aside .brand {
          font-size: 28px;
          margin: 0 0 10px;
        }
        nav {
          display: flex;
          overflow: auto;
          gap: 5px;
        }
        nav button {
          white-space: nowrap;
        }
        .nav-label,
        .aside-bottom {
          display: none;
        }
        main {
          margin: 0;
          padding: 25px 16px;
        }
        .split {
          grid-template-columns: 1fr;
        }
        h1 {
          font-size: 34px;
        }
        .list {
          max-height: 240px;
          overflow: auto;
        }
        .editor textarea {
          min-height: 260px;
        }
        header {
          gap: 10px;
        }
        .mode {
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body>
    <aside>
      <a class="brand" href="/chat">Nana</a>
      <nav id="nav"></nav>
      <div class="aside-bottom">
        <a class="button" href="/chat">← Back to chat</a>
        <p>Local when possible.<br />Powerful when needed.</p>
      </div>
    </aside>
    <main>
      <header>
        <div>
          <h1 id="heading">Your workspace</h1>
          <p id="subtitle">A place for your ideas, tasks and tools.</p>
        </div>
        <span class="mode" id="mode">Connecting…</span>
      </header>
      <div id="view"></div>
    </main>
    <div id="toast" role="status"></div>
    <dialog id="dialog"></dialog>
    <script>
      const $ = (id) => document.getElementById(id);
      let state = {},
        page = "home",
        selected = null,
        dirty = false,
        pollTimer = null,
        objectURLs = [];
      const pages = [
        ["home", "Overview"],
        ["agent", "Agents"],
        ["research", "Research"],
        ["compare", "Compare models"],
        ["note", "Notes"],
        ["task", "Tasks & reminders"],
        ["document", "Documents"],
        ["memory", "Memory"],
        ["mail", "Gmail"],
        ["event", "Calendar"],
        ["asset", "Gallery & files"],
        ["models", "Local models"],
        ["preset", "Presets"],
        ["connections", "Connections"],
        ["settings", "Settings"],
      ];
      const subtitles = {
        home: "Your ideas, tools and work in one place.",
        agent: "Give Nana a task and follow each model and tool step.",
        research:
          "Read sources and build a report with a visible source trail.",
        compare: "Choose the answer before revealing the model.",
        note: "Keep thoughts worth returning to.",
        task: "Make room for what matters next.",
        document: "Write, revise and review AI suggestions.",
        memory: "You choose what Nana remembers across conversations.",
        mail: "Read your inbox and review drafts before sending.",
        event: "Plan here and publish reviewed events to Google Calendar.",
        asset: "Your uploaded files and generated images.",
        models: "Connect local models and inspect their readiness.",
        preset: "Save reusable instructions for Nana.",
        connections: "Connect the services your workspace uses.",
        settings: "Make Nana yours.",
      };
      function el(tag, text, cls) {
        const n = document.createElement(tag);
        if (text !== undefined) n.textContent = String(text);
        if (cls) n.className = cls;
        return n;
      }
      function button(text, fn, cls) {
        const n = el("button", text, cls);
        n.type = "button";
        n.onclick = () =>
          Promise.resolve()
            .then(fn)
            .catch((e) => toast(e.message, true));
        return n;
      }
      function field(label, type = "text", value = "") {
        const wrap = el("div");
        const lab = el("label", label);
        const input = type === "textarea" ? el("textarea") : el("input");
        if (type !== "textarea") input.type = type;
        input.value = value ?? "";
        lab.append(input);
        wrap.append(lab);
        return { wrap, input };
      }
      function select(label, choices, value) {
        const f = field(label);
        const s = el("select");
        for (const [v, t] of choices) {
          const o = el("option", t);
          o.value = v;
          s.append(o);
        }
        s.value = value ?? choices[0][0];
        f.input.replaceWith(s);
        return { wrap: f.wrap, input: s };
      }
      function toast(message, error = false) {
        $("toast").textContent = message;
        $("toast").style.background = error ? "#913e50" : "";
        setTimeout(() => {
          $("toast").textContent = "";
        }, 5000);
      }
      async function api(path, method = "GET", data) {
        const r = await fetch("/api/workspace" + path, {
          method,
          headers: data ? { "Content-Type": "application/json" } : {},
          body: data ? JSON.stringify(data) : undefined,
        });
        if (r.status === 401) {
          location.href = "/auth";
          throw Error("Sign in required");
        }
        const d = await r.json();
        if (!r.ok) throw Error(d.error || "Request failed");
        return d;
      }
      async function auth(path, data) {
        const r = await fetch("/api/auth" + path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data || {}),
        });
        const d = await r.json();
        if (!r.ok) throw Error(d.error);
        return d;
      }
      async function refresh() {
        state = await api("/state");
        document.body.classList.toggle(
          "dark",
          state.preferences.theme === "dark",
        );
        $("mode").textContent = state.real_allowed
          ? "Live · " + (state.user || "This Mac")
          : "Preview · model calls are mocked";
      }
      async function navigate(next) {
        if (dirty && !confirm("Discard your unsaved changes?")) return;
        clearTimeout(pollTimer);
        page = next;
        selected = null;
        dirty = false;
        location.hash = next;
        await refresh();
        render();
      }
      function render() {
        objectURLs.forEach(URL.revokeObjectURL);
        objectURLs = [];
        $("heading").textContent =
          pages.find((x) => x[0] === page)?.[1] || "Workspace";
        $("subtitle").textContent = subtitles[page] || "";
        $("nav").replaceChildren();
        for (const [id, name] of pages)
          $("nav").append(
            button(name, () => navigate(id), page === id ? "active" : ""),
          );
        $("view").replaceChildren();
        if (page === "home") overview();
        else if (
          ["note", "task", "document", "memory", "event", "preset"].includes(
            page,
          )
        )
          records();
        else if (["agent", "research", "compare"].includes(page)) runPage();
        else if (page === "mail") mailPage();
        else if (page === "asset") gallery();
        else if (page === "models") models();
        else if (page === "connections") connectionPage();
        else if (page === "settings") settingsPage();
      }
      function empty(text) {
        $("view").append(el("div", text, "empty"));
      }
      function overview() {
        const grid = el("div", undefined, "grid");
        for (const [k, title] of [
          ["note", "Notes"],
          ["task", "Open tasks"],
          ["document", "Documents"],
          ["memory", "Memories"],
        ]) {
          const card = el("div", undefined, "card");
          card.append(
            el("h3", title),
            el(
              "h1",
              state.items.filter(
                (x) => x.kind === k && (k !== "task" || !x.meta.done),
              ).length,
            ),
            button("Open →", () => navigate(k)),
          );
          grid.append(card);
        }
        $("view").append(grid);
        const panel = el("div", undefined, "panel");
        panel.style.marginTop = "24px";
        panel.append(el("h2", "Recent activity"));
        const notifications = state.items.filter(
          (x) => x.kind === "notification",
        );
        for (const item of notifications.slice(0, 10)) {
          const row = el("div", undefined, "row");
          row.append(
            el("p", item.title + " — " + item.content),
            button("Dismiss", async () => {
              await api("/items/" + item.id, "DELETE");
              await refresh();
              render();
            }),
          );
          panel.append(row);
        }
        for (const run of state.runs.slice(0, 5))
          panel.append(
            button(
              (run.payload.prompt || run.kind).slice(0, 70) +
                " · " +
                run.status,
              () => showRun(run.id),
              "item",
            ),
          );
        if (!notifications.length && !state.runs.length)
          panel.append(
            el(
              "p",
              "Create a note, try a model comparison or give Nana a task.",
            ),
          );
        $("view").append(panel);
      }
      function records() {
        const rows = state.items.filter((x) => x.kind === page);
        const toolbar = el("div", undefined, "row toolbar");
        const search = el("input");
        search.placeholder = "Search " + $("heading").textContent.toLowerCase();
        search.setAttribute("aria-label", "Search items");
        toolbar.append(
          search,
          button(
            "+ New",
            () => editRecord({ kind: page, title: "", content: "", meta: {} }),
            "primary",
          ),
        );
        if (page === "task")
          toolbar.append(button("Schedule reminder", () => schedule()));
        if (page === "event")
          toolbar.append(button("View Google Calendar", () => googleEvents()));
        $("view").append(toolbar);
        const split = el("div", undefined, "split"),
          list = el("div", undefined, "list"),
          editor = el("div", undefined, "panel editor");
        split.append(list, editor);
        $("view").append(split);
        function listRows(q = "") {
          list.replaceChildren();
          for (const item of rows.filter((x) =>
            (x.title + " " + x.content).toLowerCase().includes(q.toLowerCase()),
          )) {
            const b = button(item.title, () => editRecord(item), "item");
            b.append(
              el(
                "small",
                page === "task"
                  ? item.meta.done
                    ? "Completed"
                    : "Open"
                  : (item.content || "Empty").slice(0, 65),
              ),
            );
            list.append(b);
          }
          if (!list.children.length) list.append(el("p", "No items yet."));
        }
        search.oninput = () => listRows(search.value);
        listRows();
        editor.append(el("p", "Select an item, or create something new."));
        window.recordEditor = editor;
        if (selected) {
          const chosen = rows.find((x) => x.id === selected);
          if (chosen) editRecord(chosen);
        }
      }
      function editRecord(item) {
        if (dirty && !confirm("Discard unsaved changes?")) return;
        dirty = false;
        selected = item.id || null;
        const panel = window.recordEditor;
        if (!panel) return;
        panel.replaceChildren();
        const title = field("Title", "text", item.title),
          body = field(
            item.kind === "memory" ? "What should Nana remember?" : "Content",
            "textarea",
            item.content,
          );
        panel.append(title.wrap, body.wrap);
        if (item.kind === "document") {
          const formatting = el("div", undefined, "row");
          for (const [name, before, after] of [
            ["Bold", "**", "**"],
            ["Italic", "_", "_"],
            ["Heading", "## ", ""],
            ["List", "- ", ""],
            ["Code", "`", "`"],
          ])
            formatting.append(
              button(name, () => {
                const start = body.input.selectionStart,
                  end = body.input.selectionEnd;
                const selectedText =
                  body.input.value.slice(start, end) || "text";
                body.input.setRangeText(
                  before + selectedText + after,
                  start,
                  end,
                  "select",
                );
                body.input.focus();
                dirty = true;
              }),
            );
          panel.insertBefore(formatting, body.wrap);
        }
        title.input.oninput = body.input.oninput = () => (dirty = true);
        let extra = {};
        if (item.kind === "task") {
          extra.due = field(
            "Due date",
            "datetime-local",
            localTime(item.meta.due),
          );
          panel.append(extra.due.wrap);
        }
        if (item.kind === "event") {
          extra.start = field(
            "Starts",
            "datetime-local",
            localTime(item.meta.start),
          );
          extra.end = field("Ends", "datetime-local", localTime(item.meta.end));
          panel.append(extra.start.wrap, extra.end.wrap);
        }
        const actions = el("div", undefined, "row");
        actions.style.marginTop = "18px";
        const save = async () => {
          let meta = { ...item.meta };
          for (const [key, f] of Object.entries(extra))
            meta[key] = f.input.value
              ? new Date(f.input.value).toISOString()
              : null;
          const saved = await api(
            "/items" + (item.id ? "/" + item.id : ""),
            item.id ? "PATCH" : "POST",
            {
              expected_updated: item.updated,
              kind: item.kind,
              title: title.input.value,
              content: body.input.value,
              meta,
            },
          );
          dirty = false;
          selected = saved.id;
          item = saved;
          await refresh();
          render();
          toast("Saved");
          return saved;
        };
        actions.append(button("Save", save, "primary"));
        if (item.id) {
          actions.append(
            button("Delete", async () => {
              if (!confirm("Delete “" + item.title + "”?")) return;
              await api("/items/" + item.id, "DELETE");
              dirty = false;
              selected = null;
              await refresh();
              render();
            }),
          );
          if (item.kind === "task")
            actions.append(
              button(item.meta.done ? "Reopen" : "Mark done", async () => {
                await api("/items/" + item.id, "PATCH", {
                  meta: { ...item.meta, done: !item.meta.done },
                });
                await refresh();
                render();
              }),
            );
          if (item.kind === "preset")
            actions.append(
              button("Use in chat & agents", async () => {
                await api("/preferences", "POST", {
                  system_prompt: item.content,
                });
                toast("Preset active");
              }),
            );
          if (item.kind === "event")
            actions.append(
              button("Publish to Google", async () => {
                const saved = await save();
                if (
                  !confirm(
                    "Publish “" + saved.title + "” to your Google Calendar?",
                  )
                )
                  return;
                await api("/calendar/publish", "POST", {
                  id: saved.id,
                  confirm: true,
                });
                toast("Published");
                await refresh();
                render();
              }),
            );
          if (item.kind === "document") {
            actions.append(
              button("AI suggestion", async () => {
                if (dirty) await save();
                const request = prompt("How should Nana revise this document?");
                if (!request) return;
                const run = await api("/runs", "POST", {
                  kind: "edit",
                  item_id: item.id,
                  prompt: request,
                  mode: "remote",
                });
                showRun(run.id);
              }),
              button("Revision history", async () => {
                const revisions = await api("/items/" + item.id + "/revisions");
                modal("Revision history", (d) => {
                  if (!revisions.length)
                    d.append(
                      el(
                        "p",
                        "Previous versions appear after you save an edit.",
                      ),
                    );
                  for (const rev of revisions) {

      function fileBase64(file) {
        return new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(String(r.result).split(",")[1]);
          r.onerror = reject;
          r.readAsDataURL(file);
        });
      }
      function imageEditor(img, item) {
        modal("Edit image · " + item.title, (d) => {
          const canvas = el("canvas");
          const scale = Math.min(
            1,
            1000 / Math.max(img.naturalWidth, img.naturalHeight),
          );
          canvas.width = img.naturalWidth * scale;
          canvas.height = img.naturalHeight * scale;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          d.append(canvas);
          const bar = el("div", undefined, "row");
          bar.append(
            button("Rotate 90°", () => {
              const temp = document.createElement("canvas");
              temp.width = canvas.height;
              temp.height = canvas.width;
              const t = temp.getContext("2d");
              t.translate(temp.width / 2, temp.height / 2);
              t.rotate(Math.PI / 2);
              t.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
              canvas.width = temp.width;
              canvas.height = temp.height;
              ctx.drawImage(temp, 0, 0);
            }),
            button("Crop to square", () => {
              const size = Math.min(canvas.width, canvas.height);
              const data = ctx.getImageData(
                (canvas.width - size) / 2,
                (canvas.height - size) / 2,
                size,
                size,
              );
              canvas.width = canvas.height = size;
              ctx.putImageData(data, 0, 0);
            }),
            button(
              "Save copy",
              async () => {
                const name = "edit-" + Date.now() + ".jpg";
                const data = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];
                await api("/files", "POST", { name, data });
                d.close();
                await refresh();
                render();
                toast("Edited copy saved");
              },
              "primary",
            ),
          );
          d.append(bar);
        });
      }

          "Open APIs & Services → Library. Enable Gmail API and Google Calendar API.",
          "Open Google Auth Platform → Branding. Set the app name to Nana and use your email for support and contact details.",
          "Under Audience, choose External for a personal Gmail account. Keep Testing enabled and add your Gmail address as a test user.",
          "Under Data Access, add the gmail.modify and calendar.events scopes.",
          "Under Clients, choose Create client → Desktop app. Name it Nana on my Mac.",
          "Copy the client ID and client secret into the fields above, then select Save client & connect. Sign in to Google and review the requested permissions.",
        ]) steps.append(el("li", step));
        setup.append(steps, el("p", "Enter the OAuth credentials here, not in chat. Nana handles the localhost callback; you do not need to enter a redirect URI for a Desktop app client."));
        google.append(setup);
        grid.append(google);
        const search = el("div", undefined, "panel");
        search.append(
          el("h2", "Web search"),
          el(
            "p",
            "Use a SearXNG instance with its JSON API enabled. Web reading works independently with public source URLs.",
          ),
        );
        const endpoint = field(
          "SearXNG URL",
          "url",
          state.preferences.searxng_url || "",
        );
        search.append(
          endpoint.wrap,
          button("Save search connection", async () => {
            await api("/preferences", "POST", {
              searxng_url: endpoint.input.value,
            });
            toast("Saved");
          }),
        );
        grid.append(search);
        const images = el("div", undefined, "panel");
        images.append(
          el("h2", "Image generation"),
          el(
            "p",
            "Connect a provider endpoint supporting the images/generations JSON API and b64_json output.",
          ),
        );
        const url = field("Full generation endpoint URL", "url"),
          key = field("API key", "password"),
          model = field("Image model ID");
        images.append(
          url.wrap,
          key.wrap,
          model.wrap,
          button("Save image connection", async () => {
            await api("/connections", "POST", {
              image_url: url.input.value,
              image_key: key.input.value,
              image_model: model.input.value,
            });
            key.input.value = "";
            toast("Saved");
          }),
        );
        grid.append(images);
        const mcp = el("div", undefined, "panel");
        mcp.append(
          el("h2", "MCP tools"),
          el(
            "p",
            "Configure explicit local stdio servers. Starting a server runs its executable on your Mac.",
          ),
        );
        const config = field(
          "Servers JSON",
          "textarea",
          JSON.stringify(state.preferences.mcp_servers || {}, null, 2),
        );
        const name = field("Server name for discovery");
        mcp.append(
          config.wrap,
          name.wrap,
          button("Save servers", async () => {
            await api("/preferences", "POST", {
              mcp_servers: JSON.parse(config.input.value),
            });
            toast("Saved");
          }),
          button("Discover tools", async () => {
            if (!confirm("Start the configured MCP server on your Mac?"))
              return;
            const tools = await api("/mcp/discover", "POST", {
              server: name.input.value,
            });
            modal("MCP tools", (d) =>
              d.append(el("pre", JSON.stringify(tools, null, 2))),
            );
          }),
        );
        grid.append(mcp);
        $("view").append(grid);
      }
      function settingsPage() {
        const panel = el("div", undefined, "panel");
        const theme = select(
          "Appearance",
          [
            ["light", "Cloud"],
            ["dark", "Dark"],
          ],
          state.preferences.theme || "light",
        );
        const instructions = field(
          "Saved instructions for chat and agents",
          "textarea",
          state.preferences.system_prompt || "",
        );
        panel.append(
          theme.wrap,
          instructions.wrap,
          button(
            "Save preferences",
            async () => {
              await api("/preferences", "POST", {
                theme: theme.input.value,
                system_prompt: instructions.input.value,
              });
              await refresh();
              render();
              toast("Saved");
            },
            "primary",
          ),
        );
        panel.append(el("hr"), el("h2", "Accounts & authenticator"));
        if (!state.user) {
          const link = el("a", "Create an owner account", "button");
          link.href = "/auth";
          panel.append(
            link,
            el(
              "p",
              "Without accounts, this localhost workspace is accessible to processes and browsers on this Mac.",
            ),
          );
        } else {
          panel.append(
            el("p", "Signed in as " + state.user),
            button("Set up 2FA", async () => {
              const setup = await auth("/totp/setup");
              modal("Authenticator setup", (d) => {
                const code = field("Current authenticator code");
                d.append(
                  el(
                    "p",
                    "Add this secret to your authenticator app, then verify the current code.",
                  ),
                  el("pre", setup.secret),
                  code.wrap,
                  button("Enable 2FA", async () => {
                    await auth("/totp/confirm", { code: code.input.value });
                    d.close();
                    toast("Authenticator enabled");
                  }),
                );
              });
            }),
            button("Add account", () =>
              modal("Add another Nana account", (d) => {
                const name = field("Username"),
                  pass = field("Password (at least 10 characters)", "password");
                d.append(
                  name.wrap,
                  pass.wrap,
                  button("Create", async () => {
                    await auth("/create", {
                      username: name.input.value,
                      password: pass.input.value,
                    });
                    d.close();
                    toast("Account created");
                  }),
                );
              }),
            ),
            button("Sign out", async () => {
              await auth("/logout");
              location.href = "/auth";
            }),
          );
        }
        $("view").append(panel);
        const jobs = el("div", undefined, "panel");
        jobs.style.marginTop = "20px";
        jobs.append(el("h2", "Schedules"));
        for (const job of state.jobs) {
          const row = el("div", undefined, "row");
          row.append(
            el(
              "p",
              job.title +
                " · " +
                new Date(job.due).toLocaleString() +
                " · " +
                job.status,
            ),
          );
          if (job.status === "pending")
            row.append(
              button("Cancel", async () => {
                await api("/jobs/" + job.id, "DELETE");
                await refresh();
                render();
              }),
            );
          if (job.run_id)
            row.append(button("View run", () => showRun(job.run_id)));
          jobs.append(row);
        }
        $("view").append(jobs);
      }
      window.addEventListener("beforeunload", (e) => {
        if (dirty) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      $("dialog").addEventListener("close", () => clearTimeout(pollTimer));
      (async () => {
        page = pages.some((x) => x[0] === location.hash.slice(1))
          ? location.hash.slice(1)
          : "home";
        try {
          await refresh();
          render();
        } catch (e) {
          toast(e.message, true);
        }
      })();
    </script>
  </body>
</html>
