<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#d8e4ff" />
    <title>Nana chat</title>
    <link rel="stylesheet" href="/chat-response.css" />
    <style>
      :root {
        color-scheme: light;
        --ink: #171b2b;
        --muted: #69748b;
        --line: rgba(55, 70, 105, 0.12);
        --glass: rgba(255, 255, 255, 0.43);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: #d7e4fb;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      a,
      input,
      textarea,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      button {
        border: 0;
      }
      button,
      a,
      input,
      select,
      textarea {
        outline-offset: 4px;
      }
      :focus-visible {
        outline: 2px solid #5269ba;
      }
      button,
      a {
        touch-action: manipulation;
      }
      a {
        color: inherit;
      }
      svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      [hidden] {
        display: none !important;
      }
      .ambient {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        background: linear-gradient(
          130deg,
          #bbd5fc 0%,
          #d4dfff 35%,
          #e2ebfc 65%,
          #bdbdf2 100%
        );
      }
      .cloud {
        position: absolute;
        width: 70vw;
        height: 75vh;
        border-radius: 50%;
        filter: blur(75px);
        opacity: 0.65;
        will-change: transform;
        animation: drift 22s ease-in-out infinite alternate;
      }
      .cloud.one {
        left: 12%;
        top: -30%;
        background: radial-gradient(
          ellipse,
          #f5f3ff 5%,
          #b3aaf4 65%,
          transparent 75%
        );
      }
      .cloud.two {
        right: -24%;
        top: 10%;
        background: radial-gradient(
          ellipse,
          #7dabef 0%,
          #b7dfff 60%,
          transparent 75%
        );
        animation-delay: -8s;
      }
      .cloud.three {
        left: 3%;
        bottom: -40%;
        background: radial-gradient(
          ellipse,
          #f8fcff 0%,
          #c6bbf8 65%,
          transparent 75%
        );
        animation-delay: -15s;
      }
      #water {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        filter: blur(1.5px);
      }
      @keyframes drift {
        from {
          transform: translate3d(-3%, 2%, 0) scale(1);
        }
        to {
          transform: translate3d(8%, -6%, 0) scale(1.1);
        }
      }
      .app {
        position: relative;
        display: grid;
        grid-template-columns: 270px minmax(0, 1fr);
        height: 100dvh;
        min-height: 500px;
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        padding: 25px 17px 16px;
        background: rgba(248, 248, 255, 0.52);
        border-right: 1px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(24px);
        min-height: 0;
      }
      .brand-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 8px 26px;
      }
      .brand {
        font:
          34px/1 Georgia,
          serif;
        letter-spacing: -1.3px;
        text-decoration: none;
      }
      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: transparent;
      }
      .icon-button:hover {
        background: rgba(255, 255, 255, 0.5);
      }
      .new-chat {
        display: flex;
        align-items: center;
        gap: 13px;
        background: rgba(255, 255, 255, 0.53);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 14px 18px;
        width: 100%;
        text-align: left;
        font-weight: 500;
        transition: background 0.2s;
      }
      .new-chat:hover {
        background: rgba(255, 255, 255, 0.85);
      }
      .search-box {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 25px;
        margin-top: 14px;
        color: var(--muted);
      }
      .search-box svg {
        width: 18px;
        height: 18px;
      }
      .search-box input {
        width: 100%;
        min-width: 0;
        border: 0;
        background: transparent;
        font-size: 13px;
        outline: 0;
      }
      .search-box:focus-within {
        outline: 2px solid #8a9ecf;
        outline-offset: 2px;
      }
      input::placeholder,
      textarea::placeholder {
        color: #758098;
      }
      .recent-label {
        margin: 27px 10px 12px;
        color: var(--muted);
        font-size: 12px;
      }
      .history {
        flex: 1;
        overflow: auto;
        min-height: 0;
        scrollbar-width: thin;
      }
      .conversation {
        display: flex;
        align-items: flex-start;
        gap: 13px;
        width: 100%;
        border-radius: 13px;
        padding: 13px 12px;
        background: transparent;
        text-align: left;
        margin-bottom: 4px;
      }
      .conversation:hover {
        background: rgba(255, 255, 255, 0.4);
      }
      .conversation.active {
        background: rgba(145, 161, 218, 0.16);
      }
      .conversation svg {
        width: 18px;
        height: 18px;
        margin-top: 3px;
      }
      .conversation-copy {
        min-width: 0;
      }
      .conversation-title {
        display: block;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conversation-date {
        display: block;
        margin-top: 4px;
        font-size: 11px;
        color: var(--muted);
      }
      .empty-list {
        font-size: 12px;
        color: var(--muted);
        padding: 10px;
      }
      .sidebar-footer {
        border-top: 1px solid var(--line);
        padding-top: 12px;
        margin-top: 12px;
      }
      .settings-button {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 11px 12px;
        background: transparent;
        border-radius: 12px;
        width: 100%;
        text-align: left;
        font-size: 13px;
      }
      .settings-button:hover {
        background: rgba(255, 255, 255, 0.5);
      }
      .profile {
        display: flex;
        gap: 11px;
        align-items: center;
        border-top: 1px solid var(--line);
        margin-top: 12px;
        padding: 18px 10px 0;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #a39be0;
        color: white;
        font:
          21px Georgia,
          serif;
      }
      .profile-name {
        font-size: 13px;
      }
      .profile-caption {
        display: block;
        font-size: 10px;
        color: var(--muted);
      }
      .main {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .topbar {
        height: 82px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px 26px;
        position: relative;
      }
      .mode-pill {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 9px 16px;
        background: rgba(255, 255, 255, 0.48);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 25px;
        font-size: 14px;
      }
      .mode-pill strong {
        font-weight: 600;
      }
      .mode-pill select {
        border: 0;
        background: transparent;
        font-size: 14px;
        cursor: pointer;
        max-width: 145px;
      }
      .preview-badge {
        position: absolute;
        right: 27px;
        display: flex;
        align-items: center;
        gap: 6px;
        color: #626e91;
        font-size: 11px;
      }
      .preview-badge::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #8695c0;
      }
      .mobile-toggle {
        display: none;
        position: absolute;
        left: 16px;
      }
      .chat-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: thin;
        padding: 22px max(28px, calc((100% - 840px) / 2));
        scroll-behavior: smooth;
      }
      .welcome {
        width: 100%;
        text-align: center;
      }
      .welcome h1 {
        font:
          clamp(32px, 3.9vw, 57px)/1.14 Georgia,
          "Times New Roman",
          serif;
        letter-spacing: -1.6px;
        font-weight: 400;
        margin: 0 0 14px;
      }
      .welcome p {
        font-size: 14px;
        color: #6d7896;
        margin: 0;
      }
      .main.is-empty .chat-scroll {
        flex: 1;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 38px;
      }
      .main.is-empty .welcome {
        padding-top: 30px;
      }
      .messages {
        display: flex;
        flex-direction: column;
        gap: 28px;
        max-width: 840px;
        margin: auto;
      }
      .message {
        max-width: 100%;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.75;
      }
      .message.user {
        align-self: flex-end;
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 22px 22px 5px 22px;
        max-width: 82%;
        padding: 14px 20px;
      }
      .message.assistant {
        align-self: stretch;
        padding: 8px 4px;
      }
      .assistant-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 10px;
        white-space: normal;
      }
      .assistant-label .mini-mark {
        font:
          19px Georgia,
          serif;
      }
      .message small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
        margin-top: 12px;
        white-space: normal;
      }
      .pending {
        color: #636f94;
        font-size: 13px;
        padding: 12px 4px;
      }
      .pending span {
        display: inline-block;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .composer-zone {
        width: 100%;
        max-width: 920px;
        margin: 0 auto;
        padding: 12px 28px 0;
        flex-shrink: 0;
      }
      .main.is-empty .composer-zone {
        padding-top: 0;
      }
      .composer {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.75);
        border-radius: 29px;
        padding: 13px 15px;
        box-shadow: 0 12px 45px rgba(93, 109, 161, 0.08);
        backdrop-filter: blur(20px);
      }
      .composer:focus-within {
        box-shadow:
          0 12px 45px rgba(93, 109, 161, 0.13),
          0 0 0 2px rgba(110, 131, 199, 0.25);
      }
      .composer .icon-button {
        background: rgba(70, 78, 100, 0.055);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        flex-shrink: 0;
      }
      .composer textarea {
        background: transparent;
        border: 0;
        outline: 0;
        resize: none;
        flex: 1;
        min-width: 0;
        max-height: 150px;
        min-height: 40px;
        height: 40px;
        padding: 8px 0;
        font-size: 16px;
        line-height: 24px;
      }
      .web-button {
        height: 40px;
        padding: 0 12px;
        border-radius: 20px;
        background: rgba(70, 78, 100, 0.055);
        flex-shrink: 0;
      }
      .web-button[aria-pressed="true"] {
        color: #263c77;
        background: #dce5ff;
      }
      .message a { color: #344f99; overflow-wrap: anywhere; }
      .send-button {
        display: grid;
        place-items: center;
        border-radius: 50%;
        width: 42px;
        height: 42px;
        background: #171a21;
        color: white;
        flex-shrink: 0;
        transition:
          transform 0.2s,
          background 0.2s;
      }
      .send-button:hover:enabled {
        background: #343b58;
        transform: translateY(-1px);
      }
      .send-button:disabled {
        opacity: 0.3;
      }
      .suggestions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin: 27px 0 0;
      }
      .suggestion {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 17px;
        border: 1px solid rgba(90, 103, 149, 0.1);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.4);
        font-size: 13px;
        color: #47536d;
        transition:
          background 0.2s,
          transform 0.2s;
      }
      .suggestion:hover {
        background: rgba(255, 255, 255, 0.75);
        transform: translateY(-2px);
      }
      .suggestion svg {
        width: 18px;
        height: 18px;
      }
      .main.is-empty .bottom-space {
        flex: 1;
        max-height: 27vh;
        min-height: 35px;
      }
      .bottom-space {
        height: 0;
      }
      .status {
        font-size: 12px;
        color: #5e6986;
        text-align: center;
        min-height: 26px;
        padding: 7px 5px 0;
        overflow-wrap: anywhere;
      }
      .status.error {
        color: #963b53;
      }
      .footer {
        text-align: center;
        padding: 12px 20px 20px;
        color: #7482a4;
        font-size: 11px;
        flex-shrink: 0;
      }
      .footer a {
        text-decoration: none;
        margin-left: 12px;
        color: #6a7697;
      }
      .footer a:hover {
        text-decoration: underline;
      }
      .scrim {
        display: none;
      }
      .app.sidebar-hidden {
        grid-template-columns: 0 minmax(0, 1fr);
      }
      .app.sidebar-hidden .sidebar {
        visibility: hidden;
        overflow: hidden;
        padding: 0;
      }
      .app.sidebar-hidden .mobile-toggle {
        display: flex;
      }
      dialog {
        width: min(460px, calc(100vw - 32px));
        padding: 28px;
        background: #f4f6ff;
        color: var(--ink);
        border: 1px solid white;
        border-radius: 24px;
        box-shadow: 0 25px 100px rgba(52, 61, 97, 0.2);
      }
      dialog::backdrop {
        background: rgba(39, 47, 80, 0.22);
        backdrop-filter: blur(5px);
      }
      .dialog-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 22px;
      }
      .dialog-heading h2 {
        font:
          27px Georgia,
          serif;
        margin: 0;
      }
      .field-label {
        font-size: 12px;
        color: var(--muted);
        display: grid;
        gap: 8px;
        margin: 18px 0;
      }
      .field-label select {
        width: 100%;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: white;
      }
      .mock-setting {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        margin: 20px 0 8px;
      }
      .mock-setting input {
        accent-color: #7986c0;
      }
      .hint {
        font-size: 12px;
        line-height: 1.6;
        color: var(--muted);
        margin: 8px 0;
      }
      .chat-actions {
        display: flex;
        gap: 10px;
        border-top: 1px solid var(--line);
        padding-top: 19px;
        margin-top: 20px;
      }
      .secondary {
        padding: 9px 15px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 13px;
      }
      .danger {
        color: #9d465a;
      }
      @media (min-width: 1500px) {
        .composer-zone {
          max-width: 1000px;
        }
        .app {
          grid-template-columns: 280px minmax(0, 1fr);
        }
      }
      @media (max-width: 760px) {
        .app {
          display: flex;
          min-height: 0;
        }
        .sidebar {
          position: absolute;
          left: 0;
          top: 0;
          bottom: 0;
          width: 270px;
          z-index: 5;
          transform: translateX(-100%);
          transition: transform 0.25s;
          background: rgba(242, 245, 255, 0.95);
        }
        .app.sidebar-open .sidebar {
          transform: translateX(0);
        }
        .main {
          width: 100%;
        }
        .mobile-toggle {
          display: flex;
        }
        .scrim {
          position: absolute;
          inset: 0;
          background: rgba(35, 45, 80, 0.15);
          z-index: 4;
        }
        .app.sidebar-open .scrim {
          display: block;
        }
        .topbar {
          height: 74px;
          padding: 14px;
        }
        .preview-badge {
          right: 14px;
          font-size: 10px;
        }
        .mode-pill {
          font-size: 13px;
          padding: 8px 12px;
        }
        .mode-pill select {
          font-size: 13px;
          max-width: 100px;
        }
        .composer-zone {
          padding: 10px 18px 0;
        }
        .chat-scroll {
          padding: 15px 22px;
        }
        .main.is-empty .chat-scroll {
          padding-bottom: 26px;
        }
        .welcome h1 {
          font-size: 36px;
          letter-spacing: -1px;
          max-width: 340px;
          margin: 0 auto 14px;
        }
        .welcome p {
          font-size: 12px;
        }
        .composer {
          padding: 10px;
          border-radius: 25px;
          gap: 8px;
        }
        .composer textarea {
          font-size: 15px;
        }
        .suggestions {
          gap: 8px;
          margin-top: 20px;
        }
        .suggestion {
          font-size: 11px;
          padding: 10px 12px;
          gap: 7px;
        }
        .suggestion svg {
          width: 15px;
        }
        .footer {
          font-size: 10px;
          padding-bottom: 16px;
        }
        .footer a {
          display: block;
          margin: 4px 0 0;
        }
        .main.is-empty .bottom-space {
          max-height: 22vh;
        }
        .message.user {
          max-width: 90%;
        }
        .cloud {
          width: 110vw;
        }
        .app.sidebar-hidden .sidebar {
          visibility: visible;
          padding: 25px 17px 16px;
        }
        .preview-badge {
          max-width: 60px;
          text-align: right;
        }
        .app.sidebar-hidden {
          display: flex;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
        #water {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <svg
      aria-hidden="true"
      style="position: absolute; width: 0; height: 0; overflow: hidden"
    >
      <defs>
        <symbol id="i-panel" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <path d="M9 4v16" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
          <path d="M12 4v16M4 12h16" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 4 4" />
        </symbol>
        <symbol id="i-chat" viewBox="0 0 24 24">
          <path
            d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.7-5.3a9 9 0 0 1-.7-3.5A8.5 8.5 0 0 1 12.5 4 8.5 8.5 0 0 1 21 11.5Z"
          />
        </symbol>
        <symbol id="i-settings" viewBox="0 0 24 24">
          <path
            d="m9 3-.7 2.5-2.5 1L3.5 6l-1 3 2 1.7v2.6l-2 1.7 1 3 2.3-.5 2.5 1L9 21h6l.7-2.5 2.5-1 2.3.5 1-3-2-1.7v-2.6l2-1.7-1-3-2.3.5-2.5-1L15 3Z"
          />
          <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24">
          <path d="M12 19V5m-6 6 6-6 6 6" />
        </symbol>
        <symbol id="i-book" viewBox="0 0 24 24">
          <path
            d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v14"
          />
        </symbol>
        <symbol id="i-code" viewBox="0 0 24 24">
          <path d="m7 6-5 6 5 6m10-12 5 6-5 6M14 3l-4 18" />
        </symbol>
        <symbol id="i-file" viewBox="0 0 24 24">
          <path d="M14 3H5v18h14V8Zm0 0v5h5M8 12h8m-8 4h6" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
          <path d="m6 6 12 12M6 18 18 6" />
        </symbol>
      </defs>
    </svg>
    <div class="ambient" aria-hidden="true">
      <div class="cloud one"></div>
      <div class="cloud two"></div>
      <div class="cloud three"></div>
      <canvas id="water"></canvas>
    </div>
    <div class="app" id="app">
      <button
        class="scrim"
        id="scrim"
        aria-label="Close sidebar"

    <script src="/chat-response.js"></script>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      let serverConfig = null,
        current = null,
        busy = false,
        listVersion = 0,
        viewVersion = 0;
      const desktop = window.matchMedia("(min-width: 761px)");
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      );
      function icon(name) {
        const svg = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg",
        );
        svg.setAttribute("aria-hidden", "true");
        const use = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "use",
        );
        use.setAttribute("href", `#i-${name}`);
        svg.append(use);
        return svg;
      }
      async function request(path, options = {}) {
        const response = await fetch(path, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        const data = await response.json();
        if (!response.ok)
          throw new Error(
            typeof (data.detail || data.error) === "string"
              ? data.detail || data.error
              : `Request failed (${response.status})`,
          );
        return data;
      }
      function status(message = "", error = false) {
        $("status").textContent = message;
        $("status").classList.toggle("error", error);
      }
      let chatAttachments = [], selectedChatTools = [], activeToolRun = null, uploading = false;
      const workspacePages = [["agent","Agents"],["research","Research"],["compare","Compare models"],["note","Notes"],["task","Tasks & reminders"],["document","Documents"],["memory","Memory"],["skill","Skills"],["mail","Gmail"],["event","Calendar"],["asset","Gallery & files"],["models","Local models"],["preset","Presets"],["connections","Connections"],["settings","Settings"]];
      const chatToolGroups = [
        {label:"Search the web",glyph:"globe",names:["search","read_url"]},
        {label:"Notes & workspace",glyph:"note",names:["list_items","read_item","save_item"]},
        {label:"Search past chats",glyph:"chat",names:["search_chats"]},
        {label:"Use skills",glyph:"spark",names:["read_skill"]},
        {label:"Gmail",glyph:"mail",names:["gmail_search","gmail_read"]},
        {label:"Calendar",glyph:"calendar",names:["calendar_list"]},
        {label:"Read files",glyph:"file",names:["read_attachment","read_file","list_files"]},
      ];
      const advancedTools=[{label:"Run a command",glyph:"terminal",names:["shell"],note:"You review each command"},{label:"Connected tools",glyph:"link",names:["mcp"],note:"Configured MCP connections · ask first"},{label:"Browser actions",glyph:"globe",names:["browser"],note:"You review each action"}];
      const menuPaths={back:'M15 5l-7 7 7 7',file:'M14 2H5v20h14V7z M14 2v5h5 M8 12h8 M8 16h8',paperclip:'M8 12l7-7a4 4 0 0 1 6 6L10 22a6 6 0 0 1-8-8L13 3 M6 16L17 5',globe:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M3 12h18 M12 3c-5 5-5 13 0 18 M12 3c5 5 5 13 0 18',note:'M5 3h14v18H5z M8 8h8 M8 12h8 M8 16h5',chat:'M4 4h16v12H8l-4 4z',spark:'M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z',mail:'M3 5h18v14H3z M3 6l9 7 9-7',calendar:'M4 5h16v16H4z M8 2v6 M16 2v6 M4 10h16',terminal:'M3 5h18v14H3z M6 9l3 3-3 3 M12 15h5',link:'M10 7l2-2a5 5 0 0 1 7 7l-3 3 M14 17l-2 2a5 5 0 0 1-7-7l3-3 M8 16l8-8',grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z'};
      function menuGlyph(name) {
        const span=document.createElement("span");span.className="menu-glyph";span.setAttribute("aria-hidden","true");
        const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox","0 0 24 24");
        const path=document.createElementNS(svg.namespaceURI,"path");path.setAttribute("d",menuPaths[name]||menuPaths.grid);svg.append(path);span.append(svg);return span;
      }
      function menuRow(label,glyph,action,{note="",checked=null,arrow=false}={}) {
        const row=document.createElement("button");row.className="menu-row";row.type="button";row.setAttribute("role",checked===null?"menuitem":"menuitemcheckbox");
        if(checked!==null)row.setAttribute("aria-checked",String(checked));
        const copy=document.createElement("span");copy.className="menu-copy";copy.append(document.createTextNode(label));
        if(note){const subtitle=document.createElement("small");subtitle.textContent=note;copy.append(subtitle);}
        const mark=document.createElement("span");mark.className="menu-mark";mark.setAttribute("aria-hidden","true");mark.textContent=checked?"✓":arrow?"›":"";
        row.append(menuGlyph(glyph),copy,mark);row.onclick=action;return row;
      }
      function menuSection(node,text){const section=document.createElement("div");section.className="menu-section";section.textContent=text;node.append(section);}
      function divider(node){const line=document.createElement("div");line.className="menu-divider";node.append(line);}
      function closeMenu(id){if($(id).matches(":popover-open"))$(id).hidePopover();}
      function placeMenu(menu,anchor){
        const rect=anchor.getBoundingClientRect();const width=Math.min(menu.offsetWidth,innerWidth-24);
        const availableAbove=rect.top-16,availableBelow=innerHeight-rect.bottom-16;
        menu.style.maxHeight=Math.max(130,Math.min(480,Math.max(availableAbove,availableBelow)))+"px";
        const height=menu.offsetHeight;
        menu.style.left=Math.max(12,Math.min(menu.id==="modelMenu"?rect.right-width:rect.left,innerWidth-width-12))+"px";
        menu.style.top=(availableAbove>=height||availableAbove>availableBelow?Math.max(12,rect.top-height-9):rect.bottom+9)+"px";
      }
      function openMenu(id,anchor){
        if($(id).matches(":popover-open")){closeMenu(id);return;}
        closeMenu(id==="addMenu"?"modelMenu":"addMenu");$(id).showPopover();placeMenu($(id),anchor);
        $(id).querySelector('[role^="menuitem"]')?.focus();
      }
      for(const [id,button] of [["addMenu","composerSettings"],["modelMenu","composerModel"]]) {
        $(id).addEventListener("toggle",()=>$(button).setAttribute("aria-expanded",String($(id).matches(":popover-open"))));
        $(id).onkeydown=event=>{const rows=[...$(id).querySelectorAll('[role^="menuitem"]')];const index=rows.indexOf(document.activeElement);
          if(event.key==="ArrowDown"||event.key==="ArrowUp"){event.preventDefault();rows[(index+(event.key==="ArrowDown"?1:-1)+rows.length)%rows.length]?.focus();}
          if(event.key==="Home"||event.key==="End"){event.preventDefault();rows[event.key==="Home"?0:rows.length-1]?.focus();}
          if(event.key==="Escape"){event.preventDefault();closeMenu(id);$(button).focus();}
        };
      }
      window.addEventListener("resize",()=>{closeMenu("addMenu");closeMenu("modelMenu");});
      function groupEnabled(group){return group.names.every(name=>selectedChatTools.includes(name));}
      function toggleGroup(group,view){
        const enabled=groupEnabled(group);
        if(!enabled&&$("mode").value==="hybrid") {$("menuNotice").textContent="Choose a Local or Cloud model below before enabling tools.";$("menuNotice").hidden=false;placeMenu($("addMenu"),$("composerSettings"));return;}
        selectedChatTools=enabled?selectedChatTools.filter(name=>!group.names.includes(name)):[...new Set([...selectedChatTools,...group.names])];
        syncAttachments();syncWeb();closeMenu("addMenu");$("prompt").focus();
      }
      function renderAddMenu(view="main") {
        const node=$("addMenuContent");node.replaceChildren();$("menuNotice").hidden=true;
        if(view!=="main")node.append(menuRow("Back","back",()=>renderAddMenu(),{note:""}));
        if(view==="workspace") {
          menuSection(node,"Your workspace");
          for(const [page,label] of workspacePages){const row=document.createElement("a");row.href=`/workspace#${page}`;row.target="_blank";row.rel="noopener";row.className="menu-row";row.setAttribute("role","menuitem");row.append(menuGlyph("grid"),document.createTextNode(label));row.onclick=()=>closeMenu("addMenu");node.append(row);}
        } else if(view==="advanced") {
          menuSection(node,"More tools");
          for(const group of chatToolGroups.filter(g=>!["Search the web","Notes & workspace","Use skills"].includes(g.label)))node.append(menuRow(group.label,group.glyph,()=>toggleGroup(group,view),{checked:groupEnabled(group)}));
          divider(node);menuSection(node,"Ask before running");
          for(const group of advancedTools)node.append(menuRow(group.label,group.glyph,()=>toggleGroup(group,view),{note:group.note,checked:groupEnabled(group)}));
          node.append(menuRow("Clear enabled tools","file",()=>{selectedChatTools=[];syncAttachments();syncWeb();renderAddMenu(view);}));
        } else {
          menuSection(node,"Add");node.append(menuRow("Files & photos","paperclip",()=>{closeMenu("addMenu");$("attachmentInput").click();},{note:"PDFs, images, documents and more"}));
          divider(node);menuSection(node,"Tools for this chat");
          for(const group of chatToolGroups.filter(g=>["Search the web","Notes & workspace","Use skills"].includes(g.label)))node.append(menuRow(group.label,group.glyph,()=>toggleGroup(group,view),{checked:groupEnabled(group)}));
          node.append(menuRow("More tools","terminal",()=>renderAddMenu("advanced"),{arrow:true}));
          divider(node);node.append(menuRow("Open workspace","grid",()=>renderAddMenu("workspace"),{arrow:true}));
        }
        if($("addMenu").matches(":popover-open")){placeMenu($("addMenu"),$("composerSettings"));node.querySelector('[role^="menuitem"]')?.focus();}
      }
      function modelName(model){
        const name=model.split("/").pop();
        const names={"qwen3.5:4b":"Qwen 3.5 · 4B","qwen3.8:27b":"Qwen 3.8 · 27B","gpt-oss-120b":"GPT OSS · 120B","nemotron-lightning-3p5-30b-a3b":"Nemotron Lightning","deepseek-v4p1-flash":"DeepSeek Flash","glm-5p2":"GLM 5.2"};return names[name]||name;
      }
      function syncModelPicker(){
        if(!serverConfig)return;
        const mode=$("mode").value,model=$("model").value;
        $("composerModelLabel").textContent=mode==="hybrid"?"Auto · Local & cloud":modelName(model);
        $("composerModel").title=mode==="local"?"Runs on this Mac":mode==="remote"?"Cloud model · usage charges apply":"Automatic routing · may use cloud models";
      }
      async function chooseComposerModel(mode,model){
        if(busy||uploading)return;
        closeMenu("modelMenu");$("mode").value=mode;modelChoices(mode,model);saveChatPreference("mode",mode);
        await saveSettings();syncModelPicker();
      }
      function renderModelMenu(){
        const node=$("modelMenuContent");node.replaceChildren();
        const mode=$("mode").value,selected=$("model").value;
        menuSection(node,"On this Mac");
        for(const model of [...serverConfig.known_local_models].sort((a,b)=>Number(b===serverConfig.default_models.local)-Number(a===serverConfig.default_models.local)))node.append(menuRow(modelName(model),"spark",()=>chooseComposerModel("local",model),{checked:mode==="local"&&selected===model,note:model.includes("27b")?"Larger model · uses more memory":"Fast everyday model · stays local"}));
        divider(node);menuSection(node,"Cloud");
        for(const model of serverConfig.known_fireworks_models)node.append(menuRow(modelName(model),"globe",()=>chooseComposerModel("remote",model),{checked:mode==="remote"&&selected===model,note:"Usage charges apply"}));
        divider(node);node.append(menuRow("Auto","spark",()=>chooseComposerModel("hybrid",serverConfig.default_models.hybrid),{checked:mode==="hybrid",note:"Nana chooses · may use cloud models"}));
        node.querySelectorAll('[role="menuitemcheckbox"]').forEach(row=>row.setAttribute("role","menuitemradio"));
      }
      $("composerModel").onclick=()=>{if(busy||uploading||!serverConfig)return;renderModelMenu();openMenu("modelMenu",$("composerModel"));};
      $("composerSettings").onclick=()=>{if(busy||uploading||!serverConfig)return;renderAddMenu();openMenu("addMenu",$("composerSettings"));};
      function syncAttachments() {
        $("attachmentChips").replaceChildren();
        for (const file of chatAttachments) {
          const chip=document.createElement("span"); chip.className="attachment-chip";
          const label=document.createElement("span"); label.textContent=file.name + (file.images ? ` · ${file.images} image${file.images>1?"s":""}` : "");
          const remove=document.createElement("button"); remove.textContent="×"; remove.setAttribute("aria-label",`Remove ${file.name}`); remove.disabled=busy;
          remove.onclick=()=>{chatAttachments=chatAttachments.filter(f=>f.id!==file.id); syncAttachments();syncControls();}; chip.append(label,remove); $("attachmentChips").append(chip);
        }
        $("toolHint").hidden=!selectedChatTools.length;
        const activeGroups=[...chatToolGroups,...advancedTools].filter(g=>g.names.some(n=>selectedChatTools.includes(n))).map(g=>g.label);
        $("toolHint").textContent=activeGroups.join(" · ");
      }
      $("attachmentInput").onchange=async()=>{
        const files=[...$("attachmentInput").files]; $("attachmentInput").value="";
        if(busy||uploading)return;
        uploading=true; syncControls();
        try {
          if(files.length+chatAttachments.length>4)throw Error("Attach up to 4 files per turn.");
          for(const file of files) {
            if(file.size>10*1024*1024)throw Error(`${file.name} exceeds 10 MB.`);
            status(`Adding ${file.name}…`);
            const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(",")[1]);reader.onerror=()=>reject(Error("File could not be read"));reader.readAsDataURL(file);});
            const item=await request("/api/workspace/chat/attachments",{method:"POST",body:JSON.stringify({name:file.name,data,mode:$("mode").value,model:$("model").value})});
            chatAttachments.push(item);
            if(chatAttachments.reduce((n,f)=>n+f.text_chars,0)>6000&&!selectedChatTools.includes("read_attachment"))selectedChatTools.push("read_attachment");
            syncAttachments();
          }
          status("Files attached.");
        } catch(error) { status(error.message,true); }
        finally {uploading=false;syncControls();syncWeb();}
      };
      async function workspaceTurn(conversationId,content,indicator,resume=null) {
        let state=resume||await request(`/conversations/${conversationId}/tool-run`,{method:"POST",body:JSON.stringify({content,mock:$("mock").checked,tools:selectedChatTools,attachments:chatAttachments.map(f=>f.id)})});
        activeToolRun=state.run.id;stopButton.hidden=false;stopButton.disabled=false;
        let displayedReview=null;
        while(true) {

        waterCtx.putImageData(pixels, 0, 0);
      }
      function animateWater(time) {
        if (reducedMotion.matches || document.hidden) {
          frame = null;
          return;
        }
        backlog = Math.min(backlog + time - (lastTime || time), STEP_MS * 4);
        lastTime = time;
        let energy = 1;
        for (; backlog >= STEP_MS; backlog -= STEP_MS) energy = stepWater();
        drawWater();
        if (energy > 0.25) frame = requestAnimationFrame(animateWater);
        else {
          surface.fill(0);
          surfacePrev.fill(0);
          waterCtx.clearRect(0, 0, cols, rows);
          frame = null;
          lastTime = backlog = 0;
        }
      }
      function wakeWater() {
        if (!frame && !reducedMotion.matches && !document.hidden)
          frame = requestAnimationFrame(animateWater);
      }
      resizeWater();
      window.addEventListener("resize", () => {
        resizeWater();
        lastPointer = null;
      });
      window.addEventListener(
        "pointermove",
        (event) => {
          if (event.pointerType !== "mouse") return;
          const x = event.clientX,
            y = event.clientY;
          if (lastPointer) {
            // Drag a trail between samples so fast moves leave a wake, not dots.
            const distance = Math.hypot(x - lastPointer.x, y - lastPointer.y);
            const strength = Math.min(14, 2 + distance * 0.18);
            const steps = Math.max(1, Math.ceil(distance / (CELL * 2)));
            for (let s = 1; s <= steps; s++)
              disturb(
                lastPointer.x + ((x - lastPointer.x) * s) / steps,
                lastPointer.y + ((y - lastPointer.y) * s) / steps,
                3,
                strength / steps,
              );
          }
          lastPointer = { x, y };
          wakeWater();
        },
        { passive: true },
      );
      document.addEventListener("pointerleave", () => (lastPointer = null));
      window.addEventListener(
        "pointerdown",
        (event) => {
          if (event.pointerType !== "mouse") return;
          disturb(event.clientX, event.clientY, 5, 40);
          wakeWater();
        },
        { passive: true },
      );
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && frame) {
          cancelAnimationFrame(frame);
          frame = null;
          lastTime = backlog = 0;
        } else wakeWater();
      });
      async function init() {
        syncSidebar();
        syncControls();
        try {
          serverConfig = await request("/api/chat/config");
          const preferredMode = chatPreference("mode");
          $("mode").value = ["hybrid", "remote", "local"].includes(
            preferredMode,
          )
            ? preferredMode
            : serverConfig.default_mode;
          modelChoices($("mode").value);
          // --real is an explicit opt-in. Mock-only servers always force preview.
          $("mock").checked =
            !serverConfig.real_allowed || chatPreference("preview") === "true";
          updateReplyHint();
          await loadList();
          syncControls();
        } catch (error) {
          serverConfig = null;
          syncControls();
          status(
            "Could not connect to Nana. Refresh to try again. " + error.message,
            true,
          );
        }
      }
      init();
    </script>
  </body>
</html>
