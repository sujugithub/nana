<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#d8e4ff" />
    <title>Nana chat</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #171b2b;
        --muted: #69748b;
        --line: rgba(55, 70, 105, 0.12);
        --glass: rgba(255, 255, 255, 0.43);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: #d7e4fb;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      a,
      input,
      textarea,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      button {
        border: 0;
      }
      button,
      a,
      input,
      select,
      textarea {
        outline-offset: 4px;
      }
      :focus-visible {
        outline: 2px solid #5269ba;
      }
      button,
      a {
        touch-action: manipulation;
      }
      a {
        color: inherit;
      }
      svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      [hidden] {
        display: none !important;
      }
      .ambient {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        background: linear-gradient(
          130deg,
          #bbd5fc 0%,
          #d4dfff 35%,
          #e2ebfc 65%,
          #bdbdf2 100%
        );
      }
      .cloud {
        position: absolute;
        width: 70vw;
        height: 75vh;
        border-radius: 50%;
        filter: blur(75px);
        opacity: 0.65;
        will-change: transform;
        animation: drift 22s ease-in-out infinite alternate;
      }
      .cloud.one {
        left: 12%;
        top: -30%;
        background: radial-gradient(
          ellipse,
          #f5f3ff 5%,
          #b3aaf4 65%,
          transparent 75%
        );
      }
      .cloud.two {
        right: -24%;
        top: 10%;
        background: radial-gradient(
          ellipse,
          #7dabef 0%,
          #b7dfff 60%,
          transparent 75%
        );
        animation-delay: -8s;
      }
      .cloud.three {
        left: 3%;
        bottom: -40%;
        background: radial-gradient(
          ellipse,
          #f8fcff 0%,
          #c6bbf8 65%,
          transparent 75%
        );
        animation-delay: -15s;
      }
      #water {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        filter: blur(1.5px);
      }
      @keyframes drift {
        from {
          transform: translate3d(-3%, 2%, 0) scale(1);
        }
        to {
          transform: translate3d(8%, -6%, 0) scale(1.1);
        }
      }
      .app {
        position: relative;
        display: grid;
        grid-template-columns: 270px minmax(0, 1fr);
        height: 100dvh;
        min-height: 500px;
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        padding: 25px 17px 16px;
        background: rgba(248, 248, 255, 0.52);
        border-right: 1px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(24px);
        min-height: 0;
      }
      .brand-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 8px 26px;
      }
      .brand {
        font:
          34px/1 Georgia,
          serif;
        letter-spacing: -1.3px;
        text-decoration: none;
      }
      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: transparent;
      }
      .icon-button:hover {
        background: rgba(255, 255, 255, 0.5);
      }
      .new-chat {
        display: flex;
        align-items: center;
        gap: 13px;
        background: rgba(255, 255, 255, 0.53);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 14px 18px;
        width: 100%;
        text-align: left;
        font-weight: 500;
        transition: background 0.2s;
      }
      .new-chat:hover {
        background: rgba(255, 255, 255, 0.85);
      }
      .search-box {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 25px;
        margin-top: 14px;
        color: var(--muted);
      }
      .search-box svg {
        width: 18px;
        height: 18px;
      }
      .search-box input {
        width: 100%;
        min-width: 0;
        border: 0;
        background: transparent;
        font-size: 13px;
        outline: 0;
      }
      .search-box:focus-within {
        outline: 2px solid #8a9ecf;
        outline-offset: 2px;
      }
      input::placeholder,
      textarea::placeholder {
        color: #758098;
      }
      .recent-label {
        margin: 27px 10px 12px;
        color: var(--muted);
        font-size: 12px;
      }
      .history {
        flex: 1;
        overflow: auto;
        min-height: 0;
        scrollbar-width: thin;
      }
      .conversation {
        display: flex;
        align-items: flex-start;
        gap: 13px;
        width: 100%;
        border-radius: 13px;
        padding: 13px 12px;
        background: transparent;
        text-align: left;
        margin-bottom: 4px;
      }
      .conversation:hover {
        background: rgba(255, 255, 255, 0.4);
      }
      .conversation.active {
        background: rgba(145, 161, 218, 0.16);
      }
      .conversation svg {
        width: 18px;
        height: 18px;
        margin-top: 3px;
      }
      .conversation-copy {
        min-width: 0;
      }
      .conversation-title {
        display: block;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conversation-date {
        display: block;
        margin-top: 4px;
        font-size: 11px;
        color: var(--muted);
      }
      .empty-list {
        font-size: 12px;
        color: var(--muted);
        padding: 10px;
      }
      .sidebar-footer {
        border-top: 1px solid var(--line);
        padding-top: 12px;
        margin-top: 12px;
      }
      .settings-button {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 11px 12px;
        background: transparent;
        border-radius: 12px;
        width: 100%;
        text-align: left;
        font-size: 13px;
      }
      .settings-button:hover {
        background: rgba(255, 255, 255, 0.5);
      }
      .profile {
        display: flex;
        gap: 11px;
        align-items: center;
        border-top: 1px solid var(--line);
        margin-top: 12px;
        padding: 18px 10px 0;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #a39be0;
        color: white;
        font:
          21px Georgia,
          serif;
      }
      .profile-name {
        font-size: 13px;
      }
      .profile-caption {
        display: block;
        font-size: 10px;
        color: var(--muted);
      }
      .main {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .topbar {
        height: 82px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px 26px;
        position: relative;
      }
      .mode-pill {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 9px 16px;
        background: rgba(255, 255, 255, 0.48);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 25px;
        font-size: 14px;
      }
      .mode-pill strong {
        font-weight: 600;
      }
      .mode-pill select {
        border: 0;
        background: transparent;
        font-size: 14px;
        cursor: pointer;
        max-width: 145px;
      }
      .preview-badge {
        position: absolute;
        right: 27px;
        display: flex;
        align-items: center;
        gap: 6px;
        color: #626e91;
        font-size: 11px;
      }
      .preview-badge::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #8695c0;
      }
      .mobile-toggle {
        display: none;
        position: absolute;
        left: 16px;
      }
      .chat-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: thin;
        padding: 22px max(28px, calc((100% - 840px) / 2));
        scroll-behavior: smooth;
      }
      .welcome {
        width: 100%;
        text-align: center;
      }
      .welcome h1 {
        font:
          clamp(32px, 3.9vw, 57px)/1.14 Georgia,
          "Times New Roman",
          serif;
        letter-spacing: -1.6px;
        font-weight: 400;
        margin: 0 0 14px;
      }
      .welcome p {
        font-size: 14px;
        color: #6d7896;
        margin: 0;
      }
      .main.is-empty .chat-scroll {
        flex: 1;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 38px;
      }
      .main.is-empty .welcome {
        padding-top: 30px;
      }
      .messages {
        display: flex;
        flex-direction: column;
        gap: 28px;
        max-width: 840px;
        margin: auto;
      }
      .message {
        max-width: 100%;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.75;
      }
      .message.user {
        align-self: flex-end;
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 22px 22px 5px 22px;
        max-width: 82%;
        padding: 14px 20px;
      }
      .message.assistant {
        align-self: stretch;
        padding: 8px 4px;
      }
      .assistant-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 10px;
        white-space: normal;
      }
      .assistant-label .mini-mark {
        font:
          19px Georgia,
          serif;
      }
      .message small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
        margin-top: 12px;
        white-space: normal;
      }
      .pending {
        color: #636f94;
        font-size: 13px;
        padding: 12px 4px;
      }
      .pending span {
        display: inline-block;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .composer-zone {
        width: 100%;
        max-width: 920px;
        margin: 0 auto;
        padding: 12px 28px 0;
        flex-shrink: 0;
      }
      .main.is-empty .composer-zone {
        padding-top: 0;
      }
      .composer {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.75);
        border-radius: 29px;
        padding: 13px 15px;
        box-shadow: 0 12px 45px rgba(93, 109, 161, 0.08);
        backdrop-filter: blur(20px);
      }
      .composer:focus-within {
        box-shadow:
          0 12px 45px rgba(93, 109, 161, 0.13),
          0 0 0 2px rgba(110, 131, 199, 0.25);
      }
      .composer .icon-button {
        background: rgba(70, 78, 100, 0.055);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        flex-shrink: 0;
      }
      .composer textarea {
        background: transparent;
        border: 0;
        outline: 0;
        resize: none;
        flex: 1;
        min-width: 0;
        max-height: 150px;
        min-height: 40px;
        height: 40px;
        padding: 8px 0;
        font-size: 16px;
        line-height: 24px;
      }
      .send-button {
        display: grid;
        place-items: center;
        border-radius: 50%;
        width: 42px;
        height: 42px;
        background: #171a21;
        color: white;
        flex-shrink: 0;
        transition:
          transform 0.2s,
          background 0.2s;
      }
      .send-button:hover:enabled {
        background: #343b58;
        transform: translateY(-1px);
      }
      .send-button:disabled {
        opacity: 0.3;
      }
      .suggestions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin: 27px 0 0;
      }
      .suggestion {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 17px;
        border: 1px solid rgba(90, 103, 149, 0.1);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.4);
        font-size: 13px;
        color: #47536d;
        transition:
          background 0.2s,
          transform 0.2s;
      }
      .suggestion:hover {
        background: rgba(255, 255, 255, 0.75);
        transform: translateY(-2px);
      }
      .suggestion svg {
        width: 18px;
        height: 18px;
      }
      .main.is-empty .bottom-space {
        flex: 1;
        max-height: 27vh;
        min-height: 35px;
      }
      .bottom-space {
        height: 0;
      }
      .status {
        font-size: 12px;
        color: #5e6986;
        text-align: center;
        min-height: 26px;
        padding: 7px 5px 0;
        overflow-wrap: anywhere;
      }
      .status.error {
        color: #963b53;
      }
      .footer {
        text-align: center;
        padding: 12px 20px 20px;
        color: #7482a4;
        font-size: 11px;
        flex-shrink: 0;
      }
      .footer a {
        text-decoration: none;
        margin-left: 12px;
        color: #6a7697;
      }
      .footer a:hover {
        text-decoration: underline;
      }
      .scrim {
        display: none;
      }
      .app.sidebar-hidden {
        grid-template-columns: 0 minmax(0, 1fr);
      }
      .app.sidebar-hidden .sidebar {
        visibility: hidden;
        overflow: hidden;
        padding: 0;
      }
      .app.sidebar-hidden .mobile-toggle {
        display: flex;
      }
      dialog {
        width: min(460px, calc(100vw - 32px));
        padding: 28px;
        background: #f4f6ff;
        color: var(--ink);
        border: 1px solid white;
        border-radius: 24px;
        box-shadow: 0 25px 100px rgba(52, 61, 97, 0.2);
      }
      dialog::backdrop {
        background: rgba(39, 47, 80, 0.22);
        backdrop-filter: blur(5px);
      }
      .dialog-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 22px;
      }
      .dialog-heading h2 {
        font:
          27px Georgia,
          serif;
        margin: 0;
      }
      .field-label {
        font-size: 12px;
        color: var(--muted);
        display: grid;
        gap: 8px;
        margin: 18px 0;
      }
      .field-label select {
        width: 100%;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: white;
      }
      .mock-setting {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        margin: 20px 0 8px;
      }
      .mock-setting input {
        accent-color: #7986c0;
      }
      .hint {
        font-size: 12px;
        line-height: 1.6;
        color: var(--muted);
        margin: 8px 0;
      }
      .chat-actions {
        display: flex;
        gap: 10px;
        border-top: 1px solid var(--line);
        padding-top: 19px;
        margin-top: 20px;
      }
      .secondary {
        padding: 9px 15px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 13px;
      }
      .danger {
        color: #9d465a;
      }
      @media (min-width: 1500px) {
        .composer-zone {
          max-width: 1000px;
        }
        .app {
          grid-template-columns: 280px minmax(0, 1fr);
        }
      }
      @media (max-width: 760px) {
        .app {
          display: flex;
          min-height: 0;
        }
        .sidebar {
          position: absolute;
          left: 0;
          top: 0;
          bottom: 0;
          width: 270px;
          z-index: 5;
          transform: translateX(-100%);
          transition: transform 0.25s;
          background: rgba(242, 245, 255, 0.95);
        }
        .app.sidebar-open .sidebar {
          transform: translateX(0);
        }
        .main {
          width: 100%;
        }
        .mobile-toggle {
          display: flex;
        }
        .scrim {
          position: absolute;
          inset: 0;
          background: rgba(35, 45, 80, 0.15);
          z-index: 4;
        }
        .app.sidebar-open .scrim {
          display: block;
        }
        .topbar {
          height: 74px;
          padding: 14px;
        }
        .preview-badge {
          right: 14px;
          font-size: 10px;
        }
        .mode-pill {
          font-size: 13px;
          padding: 8px 12px;
        }
        .mode-pill select {
          font-size: 13px;
          max-width: 100px;
        }
        .composer-zone {
          padding: 10px 18px 0;
        }
        .chat-scroll {
          padding: 15px 22px;
        }
        .main.is-empty .chat-scroll {
          padding-bottom: 26px;
        }
        .welcome h1 {
          font-size: 36px;
          letter-spacing: -1px;
          max-width: 340px;
          margin: 0 auto 14px;
        }
        .welcome p {
          font-size: 12px;
        }
        .composer {
          padding: 10px;
          border-radius: 25px;
          gap: 8px;
        }
        .composer textarea {
          font-size: 15px;
        }
        .suggestions {
          gap: 8px;
          margin-top: 20px;
        }
        .suggestion {
          font-size: 11px;
          padding: 10px 12px;
          gap: 7px;
        }
        .suggestion svg {
          width: 15px;
        }
        .footer {
          font-size: 10px;
          padding-bottom: 16px;
        }
        .footer a {
          display: block;
          margin: 4px 0 0;
        }
        .main.is-empty .bottom-space {
          max-height: 22vh;
        }
        .message.user {
          max-width: 90%;
        }
        .cloud {
          width: 110vw;
        }
        .app.sidebar-hidden .sidebar {
          visibility: visible;
          padding: 25px 17px 16px;
        }
        .preview-badge {
          max-width: 60px;
          text-align: right;
        }
        .app.sidebar-hidden {
          display: flex;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
        #water {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <svg
      aria-hidden="true"
      style="position: absolute; width: 0; height: 0; overflow: hidden"
    >
      <defs>
        <symbol id="i-panel" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <path d="M9 4v16" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
          <path d="M12 4v16M4 12h16" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 4 4" />
        </symbol>
        <symbol id="i-chat" viewBox="0 0 24 24">
          <path
            d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.7-5.3a9 9 0 0 1-.7-3.5A8.5 8.5 0 0 1 12.5 4 8.5 8.5 0 0 1 21 11.5Z"
          />
        </symbol>
        <symbol id="i-settings" viewBox="0 0 24 24">
          <path
            d="m9 3-.7 2.5-2.5 1L3.5 6l-1 3 2 1.7v2.6l-2 1.7 1 3 2.3-.5 2.5 1L9 21h6l.7-2.5 2.5-1 2.3.5 1-3-2-1.7v-2.6l2-1.7-1-3-2.3.5-2.5-1L15 3Z"
          />
          <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24">
          <path d="M12 19V5m-6 6 6-6 6 6" />
        </symbol>
        <symbol id="i-book" viewBox="0 0 24 24">
          <path
            d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v14"
          />
        </symbol>
        <symbol id="i-code" viewBox="0 0 24 24">
          <path d="m7 6-5 6 5 6m10-12 5 6-5 6M14 3l-4 18" />
        </symbol>
        <symbol id="i-file" viewBox="0 0 24 24">
          <path d="M14 3H5v18h14V8Zm0 0v5h5M8 12h8m-8 4h6" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
          <path d="m6 6 12 12M6 18 18 6" />
        </symbol>
      </defs>
    </svg>
    <div class="ambient" aria-hidden="true">
      <div class="cloud one"></div>
      <div class="cloud two"></div>
      <div class="cloud three"></div>
      <canvas id="water"></canvas>
    </div>
    <div class="app" id="app">
      <button
        class="scrim"
        id="scrim"
        aria-label="Close sidebar"
        tabindex="-1"
      ></button>
      <aside class="sidebar" id="sidebar" aria-label="Chat history">
        <div class="brand-row">
          <a class="brand" href="/chat" aria-label="Nana chat home">Nana</a
          ><button
            class="icon-button"
            id="sidebarClose"
            aria-label="Collapse sidebar"
          >
            <svg><use href="#i-panel" /></svg>
          </button>
        </div>
        <button class="new-chat" id="new">

        <label class="search-box"

        <div class="sidebar-footer">

          </button>
          <div class="profile">

              maxlength="10000"

          <div class="suggestions" id="suggestions">
            <button
              class="suggestion"
              data-prompt="Explain a concept to me in simple terms: "
            >
              <svg><use href="#i-book" /></svg>Explain a concept</button
            ><button
              class="suggestion"
              data-prompt="Help me write or debug this code: "
            >
              <svg><use href="#i-code" /></svg>Help me code</button
            ><button
              class="suggestion"
              data-prompt="Summarise this document for me: "
            >
              <svg><use href="#i-file" /></svg>Summarise a document

          Local when possible. Powerful when needed.<a href="/"

    </div>
    <dialog id="settingsDialog" aria-labelledby="settingsTitle">
      <div class="dialog-heading">
        <h2 id="settingsTitle">Chat settings</h2>
        <button
          class="icon-button"
          id="closeSettings"
          aria-label="Close settings"
        >
          <svg><use href="#i-close" /></svg>
        </button>
      </div>
      <label class="field-label"
        >Model<select id="model" aria-label="Model"></select
      ></label>
      <p class="hint" id="modeHint"></p>
      <label class="mock-setting"
        ><input id="mock" type="checkbox" checked />Preview mode</label
      >
      <p class="hint" id="replyHint"></p>
      <div class="chat-actions">
        <button id="rename" class="secondary" disabled>Rename chat</button
        ><button id="delete" class="secondary danger" disabled>
          Delete chat
        </button>
      </div>
    </dialog>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      let serverConfig = null,
        current = null,
        busy = false,
        listVersion = 0,
        viewVersion = 0;
      const desktop = window.matchMedia("(min-width: 761px)");
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      );
      function icon(name) {
        const svg = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg",
        );
        svg.setAttribute("aria-hidden", "true");
        const use = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "use",
        );
        use.setAttribute("href", `#i-${name}`);
        svg.append(use);
        return svg;
      }
      async function request(path, options = {}) {
        const response = await fetch(path, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        const data = await response.json();
        if (!response.ok)
          throw new Error(
            typeof (data.detail || data.error) === "string"
              ? data.detail || data.error
              : `Request failed (${response.status})`,
          );
        return data;
      }
      function status(message = "", error = false) {
        $("status").textContent = message;
        $("status").classList.toggle("error", error);
      }
      let activeChatStream = null;
      const stopButton = document.createElement("button");
      stopButton.className = "icon-button";
      stopButton.textContent = "■";
      stopButton.title = "Stop generation";
      stopButton.setAttribute("aria-label", "Stop generation");
      stopButton.hidden = true;
      $("send").after(stopButton);
      stopButton.onclick = async () => {
        if (!activeChatStream) return;
        stopButton.disabled = true;
        status("Stopping generation…");
        try {
          await request(`/conversations/streams/${activeChatStream}/cancel`, {
            method: "POST",
            body: "{}",
          });
        } catch (error) {
          status(error.message, true);
        }
      };
      async function streamedTurn(conversationId, content, indicator) {
        activeChatStream = crypto.randomUUID();
        stopButton.hidden = false;
        stopButton.disabled = false;
        const response = await fetch(
          `/conversations/${conversationId}/stream`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              content,
              mock: $("mock").checked,
              stream_id: activeChatStream,
            }),
          },
        );
        if (!response.ok) {
          const data = await response.json();
          throw Error(data.error || "Generation failed");
        }
        const reader = response.body.getReader(),
          decoder = new TextDecoder();
        let buffer = "",
          result = null;
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let boundary;
          while ((boundary = buffer.indexOf("\n\n")) >= 0) {
            const frame = buffer.slice(0, boundary);
            buffer = buffer.slice(boundary + 2);
            if (!frame.startsWith("data: ")) continue;
            const event = JSON.parse(frame.slice(6));
            if (event.type === "attempt") {
              indicator.textContent = "";
              pendingModelStatus(event);
            } else if (event.type === "delta") {
              indicator.textContent += event.text;
              $("chatScroll").scrollTop = $("chatScroll").scrollHeight;
            } else if (event.type === "complete") result = event.result;
            else if (event.type === "error") throw Error(event.error);
          }
        }
        if (!result)
          throw Error(
            "Generation stream ended before completion; the unfinished turn was not saved.",
          );
        return result;
      }
      function pendingModelStatus(event) {
        status(
          `Responding · ${event.model.split("/").pop()} · ${event.provider}`,
        );
      }
      function syncControls() {
        $("send").disabled = busy || !serverConfig || !$("prompt").value.trim();
        for (const id of ["new", "mode", "model", "search"])
          $(id).disabled = busy || !serverConfig;
        $("prompt").disabled = busy || !serverConfig;
        $("mock").disabled = busy || !serverConfig?.real_allowed;
        $("rename").disabled = $("delete").disabled = busy || !current;
        document
          .querySelectorAll(".conversation,.suggestion")
          .forEach((button) => (button.disabled = busy));
      }
      function setBusy(value) {
        busy = value;
        $("messages").setAttribute("aria-busy", String(value));
        syncControls();
      }
      function resizePrompt() {
        $("prompt").style.height = "40px";
        $("prompt").style.height =
          Math.min(150, $("prompt").scrollHeight) + "px";
      }
      // Only UI preferences are stored here; credentials stay on the server.
      function chatPreference(name) {
        try {
          return localStorage.getItem(`nana.chat.${name}`);
        } catch {
          return null;
        }
      }
      function saveChatPreference(name, value) {
        try {
          localStorage.setItem(`nana.chat.${name}`, String(value));
        } catch {
          /* Live chat still works when browser storage is unavailable. */
        }
      }
      function updateReplyHint() {
        const preview = $("mock").checked;
        $("previewBadge").textContent = preview ? "Preview mode" : "Live mode";
        $("send").title = $("send").ariaLabel = preview
          ? "Send preview message"
          : "Send message to model";
        $("replyHint").textContent = !serverConfig?.real_allowed
          ? "This server runs in preview mode. Replies are sample text; no model calls are made."
          : preview
            ? "Sample replies only. Turn off preview to use a real model."
            : $("mode").value === "local"
              ? "Runs on your machine. The first reply may download model weights."
              : "Real replies may use Fireworks and incur an API charge.";
      }
      function modelChoices(mode, selected) {
        const options =
          mode === "local"
            ? serverConfig.known_local_models
            : serverConfig.known_fireworks_models;
        const defaultModel = serverConfig.default_models[mode];
        $("model").replaceChildren();
        for (const value of [
          ...new Set([selected || defaultModel, ...options]),
        ])
          $("model").add(new Option(value.split("/").pop(), value));
        $("model").value = selected || defaultModel;
        $("modeHint").textContent =
          mode === "local"
            ? "Uses only your local model. No Fireworks calls."
            : mode === "remote"
              ? "Uses the selected Fireworks model for every reply."
              : "Nana chooses between the cheap tier and this stronger model for each request.";
        updateReplyHint();
      }
      function friendlyDate(value) {
        value = value.replace(" ", "T");
        const date = new Date(
          value.endsWith("Z") || /[+-]\d\d:\d\d$/.test(value)
            ? value
            : value + "Z",
        );
        if (Number.isNaN(date.getTime())) return "Saved chat";
        const today = new Date(),
          yesterday = new Date();
        yesterday.setDate(today.getDate() - 1);
        return date.toDateString() === today.toDateString()
          ? "Today"
          : date.toDateString() === yesterday.toDateString()
            ? "Yesterday"
            : date.toLocaleDateString(undefined, {
                month: "short",
                day: "numeric",
              });
      }
      async function loadList(search = $("search").value.trim()) {
        const version = ++listVersion;
        const items = await request(
          search
            ? `/conversations/search?q=${encodeURIComponent(search)}`
            : "/conversations",
        );
        if (version !== listVersion) return;
        $("conversations").replaceChildren();
        if (!items.length) {
          const empty = document.createElement("p");
          empty.className = "empty-list";
          empty.textContent = search
            ? "No matching conversations."
            : "Your conversations will appear here.";
          $("conversations").append(empty);
        }
        for (const item of items) {
          const button = document.createElement("button");
          button.className =
            "conversation" + (current?.id === item.id ? " active" : "");
          button.title = item.title;
          button.disabled = busy;
          if (current?.id === item.id)
            button.setAttribute("aria-current", "true");
          const copy = document.createElement("span");
          copy.className = "conversation-copy";
          const title = document.createElement("span");
          title.className = "conversation-title";
          title.textContent = item.title;
          const date = document.createElement("span");
          date.className = "conversation-date";
          date.textContent = friendlyDate(item.updated_at);
          copy.append(title, date);
          button.append(icon("chat"), copy);
          button.onclick = () => openConversation(item.id);
          $("conversations").append(button);
        }
      }
      function renderMessages(messages) {
        $("messages").replaceChildren();
        const empty = !messages.length;
        $("main").classList.toggle("is-empty", empty);
        $("welcome").hidden = !empty;
        $("suggestions").hidden = !empty;
        for (const message of messages) {
          const node = document.createElement("article");
          node.className = `message ${message.role}`;
          if (message.role === "assistant") {
            const label = document.createElement("div");
            label.className = "assistant-label";
            const mark = document.createElement("span");
            mark.className = "mini-mark";
            mark.textContent = "N";
            label.append(mark, "Nana");
            node.append(label);
          }
          const text = document.createElement("div");
          text.textContent = message.content;
          node.append(text);
          if (message.role === "assistant" && message.model_name) {
            const meta = document.createElement("small");
            meta.textContent = `${message.content.startsWith("[mock-") ? "Preview reply · " : ""}${message.model_name.split("/").pop()} · ${message.route === "cheap" ? "Cheap tier" : message.route === "strong" ? "Strong tier" : message.route || ""} · ${Number(message.latency_s || 0).toFixed(2)}s`;
            node.append(meta);
          }
          $("messages").append(node);
        }
        $("chatScroll").scrollTop = $("chatScroll").scrollHeight;
      }
      function syncSidebar() {
        const visible = desktop.matches
          ? !$("app").classList.contains("sidebar-hidden")
          : $("app").classList.contains("sidebar-open");
        $("sidebar").inert = !visible;
        $("main").inert = !desktop.matches && visible;
        $("sidebarToggle").setAttribute("aria-expanded", String(visible));
      }
      function closeSidebar() {
        const focusInSidebar = $("sidebar").contains(document.activeElement);
        $("app").classList.remove("sidebar-open");
        syncSidebar();
        if (focusInSidebar && $("sidebar").inert) $("sidebarToggle").focus();
      }
      async function openConversation(id) {
        if (busy) return;
        const version = ++viewVersion;
        setBusy(true);
        try {
          const detail = await request(`/conversations/${id}`);
          if (version !== viewVersion) return;
          current = detail.conversation;
          $("mode").value = current.mode;
          modelChoices(current.mode, current.model);
          renderMessages(detail.messages);
          $("prompt").value = "";
          resizePrompt();
          closeSidebar();
          status();
          await loadList();
        } catch (error) {
          status(error.message, true);
        } finally {
          if (version === viewVersion) setBusy(false);
        }
      }
      $("new").onclick = () => {
        if (busy || !serverConfig) return;
        ++viewVersion;
        current = null;
        renderMessages([]);
        $("prompt").value = "";
        resizePrompt();
        syncControls();
        closeSidebar();
        status();
        $("prompt").focus();
        loadList().catch((error) => status(error.message, true));
      };
      $("send").onclick = async () => {
        const content = $("prompt").value.trim();
        if (busy || !serverConfig || !content) return;
        setBusy(true);
        status("Nana is thinking…");
        const wasNew = !current;
        let pending = null;
        try {
          if (!current)
            current = await request("/conversations", {
              method: "POST",
              body: JSON.stringify({
                title: content.slice(0, 60),
                mode: $("mode").value,
                model: $("model").value,
              }),
            });
          $("main").classList.remove("is-empty");
          $("welcome").hidden = $("suggestions").hidden = true;
          pending = document.createElement("div");
          pending.className = "pending";
          const indicator = document.createElement("span");
          indicator.textContent = "Thinking…";
          pending.append(indicator);
          $("messages").append(pending);
          $("chatScroll").scrollTop = $("chatScroll").scrollHeight;
          const result = await streamedTurn(current.id, content, indicator);
          const detail = await request(`/conversations/${current.id}`);
          current = detail.conversation;
          renderMessages(detail.messages);
          $("prompt").value = "";
          resizePrompt();
          status(
            result.mock
              ? "Preview reply · No model call was made."
              : result.billable
                ? "Estimated API cost $" +
                  Number(result.routing.estimated_cost_usd).toFixed(6)
                : "Local reply · No API charge.",
          );
          await loadList();
        } catch (error) {
          pending?.remove();
          if (wasNew && !$("messages").children.length) renderMessages([]);
          status(error.message, true);
        } finally {
          activeChatStream = null;
          stopButton.hidden = true;
          setBusy(false);
          $("prompt").focus();
        }
      };
      $("prompt").oninput = () => {
        resizePrompt();
        syncControls();
      };
      $("prompt").onkeydown = (event) => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          $("send").click();
        }
      };
      $("mock").onchange = () => {
        saveChatPreference("preview", $("mock").checked);
        updateReplyHint();
      };
      let searchTimer;
      $("search").oninput = () => {
        ++listVersion;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(
          () => loadList().catch((error) => status(error.message, true)),
          180,
        );
      };
      async function saveSettings() {
        if (!current) return;
        const previous = current;
        setBusy(true);
        try {
          current = await request(`/conversations/${current.id}/settings`, {
            method: "PATCH",
            body: JSON.stringify({
              mode: $("mode").value,
              model: $("model").value,
            }),
          });
          status("Chat settings saved.");
        } catch (error) {
          $("mode").value = previous.mode;
          modelChoices(previous.mode, previous.model);
          status(error.message, true);
        } finally {
          setBusy(false);
        }
      }
      $("mode").onchange = () => {
        saveChatPreference("mode", $("mode").value);
        modelChoices($("mode").value);
        saveSettings();
      };
      $("model").onchange = saveSettings;
      $("rename").onclick = async () => {
        const title = window.prompt("Chat title", current?.title || "");
        if (!title?.trim() || !current || busy) return;
        setBusy(true);
        try {
          current = await request(`/conversations/${current.id}/title`, {
            method: "PATCH",
            body: JSON.stringify({ title: title.trim() }),
          });
          await loadList();
          status("Chat renamed.");
        } catch (error) {
          status(error.message, true);
        } finally {
          setBusy(false);
        }
      };
      $("delete").onclick = async () => {
        if (
          !current ||
          busy ||
          !window.confirm(`Delete “${current.title}” and its messages?`)
        )
          return;
        setBusy(true);
        try {
          await request(`/conversations/${current.id}`, { method: "DELETE" });
          current = null;
          renderMessages([]);
          $("prompt").value = "";
          resizePrompt();
          $("settingsDialog").close();
          await loadList();
          status("Chat deleted.");
        } catch (error) {
          status(error.message, true);
        } finally {
          setBusy(false);
        }
      };
      for (const id of ["settings", "composerSettings"])
        $(id).onclick = () => $("settingsDialog").showModal();
      $("closeSettings").onclick = () => $("settingsDialog").close();
      $("settingsDialog").onclick = (event) => {
        if (event.target === $("settingsDialog")) {
          const r = event.target.getBoundingClientRect();
          if (
            event.clientX < r.left ||
            event.clientX > r.right ||
            event.clientY < r.top ||
            event.clientY > r.bottom
          )
            event.target.close();
        }
      };
      $("sidebarClose").onclick = () => {
        if (desktop.matches) $("app").classList.add("sidebar-hidden");
        closeSidebar();
        $("sidebarToggle").focus();
      };
      $("sidebarToggle").onclick = () => {
        if (desktop.matches) $("app").classList.remove("sidebar-hidden");
        else $("app").classList.toggle("sidebar-open");
        syncSidebar();
        if (!desktop.matches && !$("sidebar").inert) $("sidebarClose").focus();
      };
      desktop.addEventListener("change", closeSidebar);
      $("scrim").onclick = closeSidebar;
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeSidebar();
      });
      document.querySelectorAll(".suggestion").forEach(
        (button) =>
          (button.onclick = () => {
            $("prompt").value = button.dataset.prompt;
            resizePrompt();
            syncControls();
            $("prompt").focus();
          }),
      );
      // Water surface: a 2D wave equation on a coarse height field (one cell per
      // CELL css px), stepped at a fixed 60 Hz and shaded by surface slope. The
      // low-res canvas is stretched by CSS, which smooths it for free. The loop
      // sleeps once the surface is calm, so an idle page costs nothing.
      const CELL = 6,
        DAMPING = 0.986,
        STEP_MS = 1000 / 60;
      const water = $("water"),
        waterCtx = water.getContext("2d");
      let cols = 0,
        rows = 0,
        surface,
        surfacePrev,
        pixels,
        frame = null,
        lastTime = 0,
        backlog = 0,
        lastPointer = null;
      function resizeWater() {
        cols = Math.ceil(innerWidth / CELL) + 2;
        rows = Math.ceil(innerHeight / CELL) + 2;
        water.width = cols;
        water.height = rows;
        surface = new Float32Array(cols * rows);
        surfacePrev = new Float32Array(cols * rows);
        pixels = waterCtx.createImageData(cols, rows);
      }
      function disturb(x, y, radius, strength) {
        const cx = x / CELL + 1,
          cy = y / CELL + 1;
        const x0 = Math.max(1, Math.floor(cx - radius)),
          x1 = Math.min(cols - 2, Math.ceil(cx + radius)),
          y0 = Math.max(1, Math.floor(cy - radius)),
          y1 = Math.min(rows - 2, Math.ceil(cy + radius));
        for (let j = y0; j <= y1; j++)
          for (let i = x0; i <= x1; i++) {
            const d = Math.hypot(i - cx, j - cy) / radius;
            if (d < 1)
              surface[j * cols + i] -=
                strength * 0.5 * (1 + Math.cos(Math.PI * d));
          }
      }
      function stepWater() {
        // `surfacePrev` is overwritten in place with the next state, then swapped.
        let energy = 0;
        for (let j = 1; j < rows - 1; j++)
          for (let i = 1, k = j * cols + 1; i < cols - 1; i++, k++) {
            const next =
              ((surface[k - 1] +
                surface[k + 1] +
                surface[k - cols] +
                surface[k + cols]) *
                0.5 -
                surfacePrev[k]) *
              DAMPING;
            surfacePrev[k] = next;
            energy = Math.max(energy, Math.abs(next));
          }
        [surface, surfacePrev] = [surfacePrev, surface];
        return energy;
      }
      function drawWater() {
        const data = pixels.data;
        for (let j = 1; j < rows - 1; j++)
          for (let i = 1, k = j * cols + 1; i < cols - 1; i++, k++) {
            // Light from the top-left: slopes facing it glint, the rest shade.
            const slope =
              surface[k - 1] -
              surface[k + 1] +
              surface[k - cols] -
              surface[k + cols];
            const p = k * 4;
            if (slope > 0) {
              data[p] = 255;
              data[p + 1] = 255;
              data[p + 2] = 255;
              data[p + 3] = Math.min(190, slope * 9);
            } else {
              data[p] = 108;
              data[p + 1] = 118;
              data[p + 2] = 214;
              data[p + 3] = Math.min(120, -slope * 6);
            }
          }
        waterCtx.putImageData(pixels, 0, 0);
      }
      function animateWater(time) {
        if (reducedMotion.matches || document.hidden) {
          frame = null;
          return;
        }
        backlog = Math.min(backlog + time - (lastTime || time), STEP_MS * 4);
        lastTime = time;
        let energy = 1;
        for (; backlog >= STEP_MS; backlog -= STEP_MS) energy = stepWater();
        drawWater();
        if (energy > 0.25) frame = requestAnimationFrame(animateWater);
        else {
          surface.fill(0);
          surfacePrev.fill(0);
          waterCtx.clearRect(0, 0, cols, rows);
          frame = null;
          lastTime = backlog = 0;
        }
      }
      function wakeWater() {
        if (!frame && !reducedMotion.matches && !document.hidden)
          frame = requestAnimationFrame(animateWater);
      }
      resizeWater();
      window.addEventListener("resize", () => {
        resizeWater();
        lastPointer = null;
      });
      window.addEventListener(
        "pointermove",
        (event) => {
          if (event.pointerType !== "mouse") return;
          const x = event.clientX,
            y = event.clientY;
          if (lastPointer) {
            // Drag a trail between samples so fast moves leave a wake, not dots.
            const distance = Math.hypot(x - lastPointer.x, y - lastPointer.y);
            const strength = Math.min(14, 2 + distance * 0.18);
            const steps = Math.max(1, Math.ceil(distance / (CELL * 2)));
            for (let s = 1; s <= steps; s++)
              disturb(
                lastPointer.x + ((x - lastPointer.x) * s) / steps,
                lastPointer.y + ((y - lastPointer.y) * s) / steps,
                3,
                strength / steps,
              );
          }
          lastPointer = { x, y };
          wakeWater();
        },
        { passive: true },
      );
      document.addEventListener("pointerleave", () => (lastPointer = null));
      window.addEventListener(
        "pointerdown",
        (event) => {
          if (event.pointerType !== "mouse") return;
          disturb(event.clientX, event.clientY, 5, 40);
          wakeWater();
        },
        { passive: true },
      );
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && frame) {
          cancelAnimationFrame(frame);
          frame = null;
          lastTime = backlog = 0;
        } else wakeWater();
      });
      async function init() {
        syncSidebar();
        syncControls();
        try {
          serverConfig = await request("/api/chat/config");
          const preferredMode = chatPreference("mode");
          $("mode").value = ["hybrid", "remote", "local"].includes(
            preferredMode,
          )
            ? preferredMode
            : serverConfig.default_mode;
          modelChoices($("mode").value);
          // --real is an explicit opt-in. Mock-only servers always force preview.
          $("mock").checked =
            !serverConfig.real_allowed || chatPreference("preview") === "true";
          updateReplyHint();
          await loadList();
          syncControls();
        } catch (error) {
          serverConfig = null;
          syncControls();
          status(
            "Could not connect to Nana. Refresh to try again. " + error.message,
            true,
          );
        }
      }
      init();
    </script>
  </body>
</html>
